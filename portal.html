<style>
:root{--bg:#FFFBF3;--sf:#F6EEDF;--ln:#E8DBC2;--d:#082F6B;--b:#0B4FA8;--r:#D91E2E;--tx:#0A1F44;--mu:#3B5278;--ok:#1e8449;--am:#c8860d}

.auth{max-width:440px;margin:40px auto}.tabs{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}
.tabs button{padding:8px 16px;border-radius:99px;border:1px solid var(--ln);background:#fff;font:700 14px "Hanken Grotesk";color:var(--d);cursor:pointer}.tabs button[aria-pressed=true]{background:#082F6B;color:#fff;border-color:#082F6B}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px}
.stats div{background:#fff;border:1px solid var(--ln);border-radius:12px;padding:14px}.stats b{display:block;font:400 1.7rem/1 "Young Serif",serif;color:var(--r)}.stats span{color:var(--mu);font-size:13px}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:12.5px;color:var(--mu);margin:6px 0 12px}.legend i{display:inline-block;width:11px;height:11px;border-radius:50%;margin-right:5px;vertical-align:-1px}

.dot.sd{background:var(--ok);border-color:var(--ok)}.dot.sw{background:#f2b705;border-color:var(--am)}.dot.so{background:var(--r);border-color:var(--r)}.dot.sn{background:#fff;border:2px solid var(--b)}
.subj{font:800 12px "Hanken Grotesk";letter-spacing:.12em;text-transform:uppercase;color:var(--r);margin:16px 0 6px}
.trow{display:grid;grid-template-columns:1fr auto auto;gap:12px;align-items:center;padding:10px 12px;border:1px solid var(--ln);border-radius:10px;background:#fff;margin-bottom:6px;cursor:pointer}
.trow:hover{border-color:var(--b)}.trow small{color:var(--mu)}
.queue li{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:10px 0;border-top:1px dashed var(--ln)}.queue li:first-child{border-top:0}.queue{list-style:none;margin:0;padding:0}
.due{font:700 12px "Hanken Grotesk";padding:3px 9px;border-radius:99px;background:#fff4d6;color:#8a5a00;white-space:nowrap}.due.o{background:#fdeceb;color:#a3121f}
.tag{font:800 10.5px "Hanken Grotesk";letter-spacing:.08em;text-transform:uppercase;padding:3px 8px;border-radius:99px;background:#EAF2FF;color:#0B4FA8}
table{width:100%;border-collapse:collapse;font-size:14px}th,td{text-align:left;padding:9px 8px;border-bottom:1px solid var(--ln);vertical-align:top}th{color:var(--mu);font-size:12px;text-transform:uppercase;letter-spacing:.06em}
.bar{height:8px;border-radius:99px;background:#efe6d4;overflow:hidden;min-width:90px}.bar i{display:block;height:100%;background:linear-gradient(90deg,#0B4FA8,#1e8449)}
#modal{position:fixed;inset:0;background:#031230cc;z-index:50;display:grid;place-items:center;padding:14px}
#modal .box{background:#fff;border-radius:14px;max-width:640px;width:100%;max-height:92vh;overflow:auto;padding:20px 22px;position:relative}
#modal .x{position:absolute;top:10px;right:10px;width:34px;height:34px;border-radius:50%;border:0;background:var(--r);color:#fff;font-size:18px;cursor:pointer}
.step{display:grid;grid-template-columns:30px 1fr;gap:10px;padding:10px 0;border-top:1px dashed var(--ln)}.step:first-of-type{border-top:0}
.step .n{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font:700 13px "Hanken Grotesk";background:#e4dccb;color:#5a4632}
.step.sd .n{background:var(--ok);color:#fff}.step.so .n{background:var(--r);color:#fff}.step.sw .n{background:#f2b705;color:#1d140a}
.step b{color:var(--d)}.step .who{font:800 10.5px "Hanken Grotesk";letter-spacing:.08em;text-transform:uppercase;color:var(--mu);margin-left:6px}.step p{margin:3px 0;color:var(--mu);font-size:14px}
.inl{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:6px}.inl input,.inl select{width:auto;flex:1;min-width:120px}
@media(max-width:700px){.stats{grid-template-columns:1fr 1fr}.trow{grid-template-columns:1fr}.hide-m{display:none}}
</style></head><body>

<script>
/* ============ SUPABASE (same as index.html) ============ */
var SUPABASE={url:"https://hwbreaitvjzqqvlaelhw.supabase.co",key:"sb_publishable__EUc6FcRwBeIqUBchI4gxA_mpp33Cac"};
/* ====================================================== */
var db,ME,SESS,BATCH,TOPICS=[],PROG={},STUDENTS=[],BATCHES={},$=function(i){return document.getElementById(i)};

function dueTxt(ms){var h=Math.round(Math.abs(ms)/36e5);var t=h>=48?Math.round(h/24)+" days":h+" h";return ms<0?"overdue by "+t:"due in "+t}

+(mode==="in"?'<h2>Welcome back</h2><form id="f"><label for="em">Email</label><input id="em" type="email" required autocomplete="username"><label for="pw">Password</label><input id="pw" type="password" required autocomplete="current-password"><div id="m"></div><p><button class="btn p" type="submit">Sign in</button></p><p style="font-size:13px;color:var(--mu)">Forgot your password? Message Arka Academy and we will reset it.</p></form>'
:'<h2>Register as a student</h2><p style="color:var(--mu);font-size:14px">After you register, Arka Academy approves your account and adds you to your batch.</p><form id="f"><label for="nm">Full name</label><input id="nm" required><label for="ph">Phone (WhatsApp)</label><input id="ph" inputmode="tel" required><label for="em">Email</label><input id="em" type="email" required autocomplete="username"><label for="pw">Password (at least 8 characters)</label><input id="pw" type="password" minlength="8" required autocomplete="new-password"><div id="m"></div><p><button class="btn p" type="submit">Register</button></p></form>')+'</div>');
document.querySelectorAll("[data-m]").forEach(function(b){b.onclick=function(){authUI(b.dataset.m)}});
$("f").onsubmit=function(e){e.preventDefault();var btn=e.target.querySelector("[type=submit]");btn.disabled=true;msg("m","");
var em=$("em").value.trim(),pw=$("pw").value;
if(mode==="in")db.auth.signInWithPassword({email:em,password:pw}).then(function(r){btn.disabled=false;if(r.error)return msg("m",r.error.message==="Invalid login credentials"?"Email or password is incorrect.":r.error.message);start(r.data.session)});
else{var nm=$("nm").value.trim(),ph=$("ph").value.trim();try{localStorage.setItem("arkaReg",JSON.stringify({n:nm,p:ph}))}catch(x){}
db.auth.signUp({email:em,password:pw}).then(function(r){btn.disabled=false;if(r.error)return msg("m",/not allowed|disabled/i.test(r.error.message)?"Registration is closed right now. Please contact Arka Academy.":r.error.message);
if(r.data.session)start(r.data.session);else msg("m","Check your email and click the confirmation link, then sign in here.",true)})}}}
/* ---------- after sign in ---------- */
function start(sess){SESS=sess;$("who").innerHTML='<small>'+esc(sess.user.email)+'</small> <button class="btn s" id="out" style="color:#fff;border-color:#fff">Sign out</button>';
$("out").onclick=function(){db.auth.signOut().then(function(){location.reload()})};
db.from("profiles").select("*").eq("id",sess.user.id).maybeSingle().then(function(r){if(r.error)return H('<div class="card msg err">'+esc(r.error.message)+'</div>');ME=r.data;
if(!ME){var reg={};try{reg=JSON.parse(localStorage.getItem("arkaReg")||"{}")}catch(x){}
if(reg.n)return createProfile(reg.n,reg.p);return db.rpc("is_admin").then(function(a){if(a.data)return H('<div class="card"><h2>You are signed in as an admin</h2><p>Manage students, mentors, batches and topics from the admin page.</p><a class="btn p" href="admin.html">Open admin page</a></div>');completeForm()})}
if(ME.status==="pending")return H('<div class="card"><h2>Registration received</h2><p>Thank you, '+esc(ME.full_name)+'. Arka Academy will approve your account and add you to your batch. Please check back soon.</p></div>');
if(ME.status!=="active")return H('<div class="card"><h2>Account not active</h2><p>Please contact Arka Academy.</p></div>');
ME.role==="mentor"?mentorHome():studentHome()})}
function completeForm(){H('<div class="auth card"><h2>Complete your registration</h2><form id="f"><label for="nm">Full name</label><input id="nm" required><label for="ph">Phone (WhatsApp)</label><input id="ph" required><div id="m"></div><p><button class="btn p" type="submit">Continue</button></p></form></div>');
$("f").onsubmit=function(e){e.preventDefault();createProfile($("nm").value.trim(),$("ph").value.trim())}}
function createProfile(n,p){db.from("profiles").insert({id:SESS.user.id,full_name:n,phone:p,email:SESS.user.email}).then(function(r){try{localStorage.removeItem("arkaReg")}catch(x){}if(r.error)return H('<div class="card msg err">'+esc(r.error.message)+'</div>');start(SESS)})}
/* ---------- the 8 steps ---------- */
var STEPS=[["Class delivered","Teacher"],["Notes shared","Teacher"],["Understood","You"],["Oral test call","Mentor"],["MCQ test attempted","You"],["Answers submitted","You"],["Evaluated","Mentor"],["Improvement call","Mentor"]];
function state(t,p,b){p=p||{};b=b||{oral_hours:48,eval_hours:24,improve_hours:48};var now=Date.now();
function mdue(start,done,hrs){if(done)return"d";if(!start)return"";return now>new Date(start).getTime()+hrs*36e5?"o":"w"}
return[t.class_done?"d":"",t.notes_done?"d":"",p.understood_at?"d":(t.class_done?"n":""),mdue(p.understood_at,p.oral_at,b.oral_hours),
p.mcq_at?"d":(p.understood_at?"n":""),p.answer_at?"d":(p.understood_at?"n":""),mdue(p.answer_at,p.eval_at,b.eval_hours),mdue(p.eval_at,p.improve_at,b.improve_hours)]}
function dots(st){return'<span class="dots" aria-label="'+st.filter(function(x){return x==="d"}).length+' of 8 steps done">'+st.map(function(x){return'<i class="dot '+(x?'s'+x:'')+'"></i>'}).join("")+'</span>'}
var LEG='<div class="legend"><span><i style="background:#1e8449"></i>Done</span><span><i style="background:#fff;border:2px solid #0B4FA8"></i>Your turn</span><span><i style="background:#f2b705"></i>Waiting on mentor</span><span><i style="background:#D91E2E"></i>Mentor overdue</span><span><i style="background:#e4dccb"></i>Not yet</span></div>';
function signed(path){return db.storage.from("copies").createSignedUrl(path,600).then(function(r){if(r.error)throw r.error;return r.data.signedUrl})}
function openFile(path){signed(path).then(function(u){window.open(u,"_blank","noopener")}).catch(function(e){alert(e.message)})}
var MAXMB=5;
function shrink(file){return new Promise(function(ok,no){var u=URL.createObjectURL(file),im=new Image();im.onload=function(){URL.revokeObjectURL(u);var s=Math.min(1,1600/Math.max(im.width,im.height)),c=document.createElement("canvas");c.width=Math.round(im.width*s);c.height=Math.round(im.height*s);var g=c.getContext("2d");g.fillStyle="#fff";g.fillRect(0,0,c.width,c.height);g.drawImage(im,0,0,c.width,c.height);
(function go(q){c.toBlob(function(b){if(!b)return no(new Error("Could not read this photo. Try a JPG or PDF."));if(b.size>900*1024&&q>0.45)return go(q-0.1);b.w=c.width;b.h=c.height;ok(b)},"image/jpeg",q)})(0.72)};im.onerror=function(){URL.revokeObjectURL(u);no(new Error("Could not read this photo. Try a JPG or PDF."))};im.src=u})}
function isImg(f){return /^image\/(jpeg|png|webp|heic|heif)?/.test(f.type)&&f.type!=="image/gif"}
/* turns 1 PDF, or 1+ photos, into one small file */
function prepare(files){files=Array.prototype.slice.call(files||[]);if(!files.length)return Promise.reject(new Error("Choose a file first."));
if(files.length===1&&!isImg(files[0])){var f=files[0];if(f.size>MAXMB*1048576)return Promise.reject(new Error("This PDF is "+(f.size/1048576).toFixed(1)+" MB. The limit is "+MAXMB+" MB. Compress it (e.g. ilovepdf.com → Compress PDF) or upload photos instead, which are compressed automatically."));return Promise.resolve(f)}
if(files.some(function(f){return !isImg(f)}))return Promise.reject(new Error("Choose either one PDF, or one or more photos. Not both."));
if(files.length>20)return Promise.reject(new Error("Up to 20 photos at a time."));
return Promise.all(files.map(shrink)).then(function(bs){if(bs.length===1){var o=new File([bs[0]],"answer.jpg",{type:"image/jpeg"});return o}
if(!window.PDFLib)throw new Error("Could not join the photos. Check your internet and try again.");
return PDFLib.PDFDocument.create().then(function(doc){return bs.reduce(function(pr,b){return pr.then(function(){return b.arrayBuffer()}).then(function(buf){return doc.embedJpg(buf)}).then(function(img){doc.addPage([img.width,img.height]).drawImage(img,{x:0,y:0,width:img.width,height:img.height})})},Promise.resolve()).then(function(){return doc.save()})}).then(function(bytes){return new File([bytes],"answer.pdf",{type:"application/pdf"})})})
.then(function(f){if(f.size>MAXMB*1048576)throw new Error("Even after compressing, this is "+(f.size/1048576).toFixed(1)+" MB. Upload fewer pages at a time.");return f})}
function upCopy(student,topic,kind,files){return prepare(files).then(function(file){var ext=file.type==="application/pdf"?"pdf":(file.name.split(".").pop()||"pdf").toLowerCase().replace(/[^a-z0-9]/g,""),path=student+"/"+topic+"/"+kind+"-"+Date.now()+"."+ext;
return db.storage.from("copies").upload(path,file,{contentType:file.type,upsert:false}).then(function(r){if(r.error)throw r.error;return path})})}
function modal(h){$("mbody").innerHTML=h;$("modal").hidden=false}
document.querySelector("#modal .x").onclick=function(){$("modal").hidden=true};$("modal").onclick=function(e){if(e.target.id==="modal")$("modal").hidden=true};
/* ---------- student ---------- */
function studentHome(){Promise.all([db.from("batches").select("*").eq("id",ME.batch_id).maybeSingle(),db.from("topics").select("*").order("sort_order").order("id"),db.from("progress").select("*").eq("student_id",ME.id),db.rpc("my_mentor")])
.then(function(r){BATCH=r[0].data||{};TOPICS=r[1].data||[];PROG={};(r[2].data||[]).forEach(function(p){PROG[p.topic_id]=p});var mt=(r[3].data||[])[0];
var all=0,done=0,full=0,wait=0,mine=[];TOPICS.forEach(function(t){var st=state(t,PROG[t.id],BATCH);all+=8;st.forEach(function(x){if(x==="d")done++;if(x==="w"||x==="o")wait++});if(st.every(function(x){return x==="d"}))full++;
if(st[2]==="n")mine.push([t,"Mark “Understood” when ready"]);else{if(st[4]==="n")mine.push([t,"Attempt the MCQ test"]);if(st[5]==="n")mine.push([t,"Write and upload your answers"])}});
var h='<h1>Hello, '+esc(ME.full_name.split(" ")[0])+'</h1><p style="color:var(--mu);margin-top:-6px">'+esc(BATCH.name||"Your batch")+(mt?' · Mentor: <b>'+esc(mt.full_name)+'</b>'+(mt.phone?' ('+esc(mt.phone)+')':''):'')+'</p>'
+'<div class="stats"><div><b>'+(all?Math.round(done/all*100):0)+'%</b><span>steps complete</span></div><div><b>'+full+'/'+TOPICS.length+'</b><span>topics fully done</span></div><div><b>'+mine.length+'</b><span>tasks waiting on you</span></div><div><b>'+wait+'</b><span>waiting on your mentor</span></div></div>';
h+='<div class="card"><h2>Your next tasks</h2>'+(mine.length?'<ul class="queue">'+mine.slice(0,8).map(function(m){return'<li><span class="tag">'+esc(m[0].subject)+'</span><span><b>'+esc(m[0].title)+'</b><br><small>'+m[1]+'</small></span><button class="btn s" data-t="'+m[0].id+'">Open</button></li>'}).join("")+'</ul>':'<p style="color:var(--mu)">Nothing pending right now. Well done.</p>')+'</div>';
h+='<div class="card"><h2>Your responsibility map</h2>'+LEG;var last="";

TOPICS.forEach(function(t){if(t.subject!==last){last=t.subject;h+='<p class="subj">'+esc(t.subject)+'</p>'}h+='<div class="trow" data-t="'+t.id+'"><span><b>'+esc(t.title)+'</b>'+(t.class_date?'<br><small>Class: '+esc(t.class_date)+'</small>':'')+'</span>'+dots(state(t,PROG[t.id],BATCH))+'<span class="btn s hide-m">Open</span></div>'});
H(h+'</div>');document.querySelectorAll("[data-t]").forEach(function(el){el.onclick=function(){topicModal(+el.dataset.t)}})})}
function topicModal(id){var t=TOPICS.filter(function(x){return x.id===id})[0],p=PROG[id]||{},st=state(t,p,BATCH);
var info=[t.class_done?"Done":"Waiting for class",t.notes_done?(t.notes_url?'<a href="'+esc(t.notes_url)+'" target="_blank" rel="noopener">Open notes</a>':"Shared"):"Not yet",
p.understood_at?"Marked "+fmtT(p.understood_at):'<button class="btn s p" id="aU">I have understood this topic</button>',
p.oral_at?"Done "+fmtT(p.oral_at)+(p.oral_score?" · Score "+p.oral_score+"/5":"")+(p.oral_remarks?"<br>"+esc(p.oral_remarks):""):(p.understood_at?"Your mentor will call you ("+dueTxt(new Date(p.understood_at).getTime()+BATCH.oral_hours*36e5-Date.now())+")":"After you mark “Understood”"),
p.mcq_at?"Done "+fmtT(p.mcq_at)+(p.mcq_score?" · Score "+esc(p.mcq_score):""):'<span class="inl"><input id="mS" placeholder="Your score, e.g. 14/20"><button class="btn s p" id="aM">Mark MCQ done</button></span>',
(p.answer_at?'Submitted '+fmtT(p.answer_at)+' · <a href="#" id="vA">View</a><br>':'')+'<span class="inl"><input id="aF" type="file" accept="application/pdf,image/*" multiple title="One PDF (max 5 MB), or photos of each page"><button class="btn s p" id="aA">'+(p.answer_at?"Replace":"Upload answers")+'</button></span><br><small style="color:#7a6a55">Select photos of all pages together (they are compressed and joined into one PDF), or one PDF under 5 MB.</small>',
p.eval_at?"Evaluated "+fmtT(p.eval_at)+(p.eval_marks?" · Marks "+esc(p.eval_marks):"")+(p.eval_path?' · <a href="#" id="vE">Evaluated copy</a>':"")+(p.eval_remarks?"<br>"+esc(p.eval_remarks):""):(p.answer_at?"Being evaluated ("+dueTxt(new Date(p.answer_at).getTime()+BATCH.eval_hours*36e5-Date.now())+")":"After you upload answers"),
p.improve_at?"Done "+fmtT(p.improve_at)+(p.improve_notes?"<br>"+esc(p.improve_notes):""):(p.eval_at?"Your mentor will call you":"After evaluation")];
modal('<p class="subj" style="margin-top:0">'+esc(t.subject)+'</p><h2>'+esc(t.title)+'</h2>'+(t.recording_url?'<p><a class="btn s" href="'+esc(t.recording_url)+'" target="_blank" rel="noopener">Class recording</a></p>':'')
+STEPS.map(function(s,i){return'<div class="step '+(st[i]&&st[i]!=="n"?"s"+st[i]:"")+'"><span class="n">'+(st[i]==="d"?"✓":i+1)+'</span><div><b>'+s[0]+'</b><span class="who">'+s[1]+'</span><p>'+info[i]+'</p></div></div>'}).join("")+'<div id="mm"></div>');
function save(fields,btn){if(btn)btn.disabled=true;fields.student_id=ME.id;fields.topic_id=id;
return db.from("progress").upsert(fields).select().single().then(function(r){if(r.error){if(btn)btn.disabled=false;return msg("mm",r.error.message)}PROG[id]=r.data;topicModal(id);studentHomeQuiet()})}
if($("aU"))$("aU").onclick=function(){save({understood_at:new Date().toISOString()},this)};
if($("aM"))$("aM").onclick=function(){save({mcq_at:new Date().toISOString(),mcq_score:$("mS").value.trim()||null},this)};
$("aA").onclick=function(){var f=$("aF").files,b=this;if(!f.length)return msg("mm","Choose your answer: one PDF, or photos of each page.");b.disabled=true;msg("mm","Compressing and uploading…",true);
upCopy(ME.id,id,"answer",f).then(function(path){return save({answer_path:path,answer_at:new Date().toISOString()},b)}).catch(function(e){b.disabled=false;msg("mm",e.message)})};
if($("vA"))$("vA").onclick=function(e){e.preventDefault();openFile(p.answer_path)};if($("vE"))$("vE").onclick=function(e){e.preventDefault();openFile(p.eval_path)}}
var qt;function studentHomeQuiet(){clearTimeout(qt);qt=setTimeout(function(){if($("modal").hidden)studentHome()},300)}
$("modal").addEventListener("click",function(e){if(e.target.id==="modal"||e.target.classList.contains("x"))ME&&ME.role==="student"?studentHome():ME&&ME.role==="mentor"&&mentorHome()});
/* ---------- mentor ---------- */
var VIEW="queue",SEL=null;
function mentorHome(){Promise.all([db.from("profiles").select("*").eq("mentor_id",ME.id).eq("status","active").order("full_name"),db.from("topics").select("*").order("sort_order").order("id"),db.from("progress").select("*"),db.from("batches").select("*")])
.then(function(r){STUDENTS=r[0].data||[];TOPICS=r[1].data||[];PROG={};(r[2].data||[]).forEach(function(p){PROG[p.student_id+":"+p.topic_id]=p});BATCHES={};(r[3].data||[]).forEach(function(b){BATCHES[b.id]=b});renderMentor()})}
function queue(){var q=[],now=Date.now();STUDENTS.forEach(function(s){var b=BATCHES[s.batch_id]||{};TOPICS.filter(function(t){return t.batch_id===s.batch_id}).forEach(function(t){var p=PROG[s.id+":"+t.id];if(!p)return;
if(p.understood_at&&!p.oral_at)q.push([s,t,"Oral test call",new Date(p.understood_at).getTime()+(b.oral_hours||48)*36e5]);
if(p.answer_at&&!p.eval_at)q.push([s,t,"Evaluate answers",new Date(p.answer_at).getTime()+(b.eval_hours||24)*36e5]);
if(p.eval_at&&!p.improve_at)q.push([s,t,"Improvement call",new Date(p.eval_at).getTime()+(b.improve_hours||48)*36e5])})});return q.sort(function(a,b){return a[3]-b[3]})}
function renderMentor(){var q=queue(),od=q.filter(function(x){return x[3]<Date.now()}).length;
var h='<h1>Mentor dashboard</h1><div class="stats"><div><b>'+STUDENTS.length+'</b><span>your students</span></div><div><b>'+q.length+'</b><span>tasks pending</span></div><div><b>'+od+'</b><span>overdue</span></div><div><b>'+TOPICS.filter(function(t){return!t.class_done}).length+'</b><span>topics yet to be taught</span></div></div>'
+'<div class="tabs"><button type="button" data-v="queue" aria-pressed="'+(VIEW==="queue")+'">Work queue</button><button type="button" data-v="students" aria-pressed="'+(VIEW==="students")+'">Students</button><button type="button" data-v="topics" aria-pressed="'+(VIEW==="topics")+'">Batch topics</button></div>';
if(VIEW==="queue")h+='<div class="card"><h2>Work queue</h2>'+(q.length?'<ul class="queue">'+q.map(function(x){var ms=x[3]-Date.now();return'<li><span class="due'+(ms<0?" o":"")+'">'+dueTxt(ms)+'</span><span><b>'+esc(x[2])+'</b> · '+esc(x[0].full_name)+'<br><small>'+esc(x[1].subject)+': '+esc(x[1].title)+(x[0].phone?' · '+esc(x[0].phone):'')+'</small></span><button class="btn s p" data-st="'+x[0].id+'" data-tp="'+x[1].id+'">Open</button></li>'}).join("")+'</ul>':'<p style="color:var(--mu)">All caught up.</p>')+'</div>';
if(VIEW==="students"){h+='<div class="card"><h2>Your students</h2>'+(STUDENTS.length?'<table><tr><th>Student</th><th>Batch</th><th>Progress</th><th class="hide-m">Pending</th><th></th></tr>'+STUDENTS.map(function(s){var ts=TOPICS.filter(function(t){return t.batch_id===s.batch_id}),d=0,pend=0;ts.forEach(function(t){state(t,PROG[s.id+":"+t.id],BATCHES[s.batch_id]).forEach(function(x){if(x==="d")d++;if(x==="w"||x==="o")pend++})});var pc=ts.length?Math.round(d/(ts.length*8)*100):0;
return'<tr><td><b>'+esc(s.full_name)+'</b><br><small>'+esc(s.phone||"")+'</small></td><td>'+esc((BATCHES[s.batch_id]||{}).name||"")+'</td><td><div class="bar"><i style="width:'+pc+'%"></i></div><small>'+pc+'%</small></td><td class="hide-m">'+pend+'</td><td><button class="btn s" data-sv="'+s.id+'">Open</button></td></tr>'}).join("")+'</table>':'<p style="color:var(--mu)">No students are assigned to you yet.</p>')+'</div>';
if(SEL){var s=STUDENTS.filter(function(x){return x.id===SEL})[0];if(s){h+='<div class="card"><h2>'+esc(s.full_name)+'</h2>'+LEG;var last="";TOPICS.filter(function(t){return t.batch_id===s.batch_id}).forEach(function(t){if(t.subject!==last){last=t.subject;h+='<p class="subj">'+esc(t.subject)+'</p>'}h+='<div class="trow" data-st="'+s.id+'" data-tp="'+t.id+'"><span><b>'+esc(t.title)+'</b></span>'+dots(state(t,PROG[s.id+":"+t.id],BATCHES[s.batch_id]))+'<span class="btn s hide-m">Open</span></div>'});h+='</div>'}}}
if(VIEW==="topics")h+='<div class="card"><h2>Batch topics</h2><p style="color:var(--mu)">Tick when a class is delivered and when notes are shared. Students see it on their map.</p>'+(TOPICS.length?'<table><tr><th>Topic</th><th>Class delivered</th><th>Notes shared</th><th class="hide-m">Notes link</th></tr>'+TOPICS.map(function(t){return'<tr><td><small>'+esc((BATCHES[t.batch_id]||{}).name||"")+' · '+esc(t.subject)+'</small><br><b>'+esc(t.title)+'</b></td><td><input type="checkbox" data-tc="'+t.id+'"'+(t.class_done?" checked":"")+'></td><td><input type="checkbox" data-tn="'+t.id+'"'+(t.notes_done?" checked":"")+'></td><td class="hide-m"><span class="inl"><input data-tl="'+t.id+'" value="'+esc(t.notes_url||"")+'" placeholder="https://…"><button class="btn s" data-tls="'+t.id+'">Save</button></span></td></tr>'}).join("")+'</table>':'<p>No topics yet. Arka Academy adds them from the admin page.</p>')+'</div>';
H(h);document.querySelectorAll("[data-v]").forEach(function(b){b.onclick=function(){VIEW=b.dataset.v;renderMentor()}});
document.querySelectorAll("[data-sv]").forEach(function(b){b.onclick=function(){SEL=b.dataset.sv;renderMentor()}});
document.querySelectorAll("[data-tp]").forEach(function(b){b.onclick=function(){mentorModal(b.dataset.st,+b.dataset.tp)}});
document.querySelectorAll("[data-tc],[data-tn]").forEach(function(c){c.onchange=function(){var f={};f[c.dataset.tc?"class_done":"notes_done"]=c.checked;db.from("topics").update(f).eq("id",c.dataset.tc||c.dataset.tn).then(function(r){if(r.error){alert(r.error.message);c.checked=!c.checked}else mentorHome()})}});
document.querySelectorAll("[data-tls]").forEach(function(b){b.onclick=function(){var v=document.querySelector('[data-tl="'+b.dataset.tls+'"]').value.trim();if(v&&!/^https?:\/\//.test(v))return alert("Please paste a full link starting with https://");db.from("topics").update({notes_url:v||null}).eq("id",b.dataset.tls).then(function(r){r.error?alert(r.error.message):(b.textContent="Saved")})}})}
function mentorModal(sid,tid){var s=STUDENTS.filter(function(x){return x.id===sid})[0],t=TOPICS.filter(function(x){return x.id===tid})[0],p=PROG[sid+":"+tid]||{},st=state(t,p,BATCHES[s.batch_id]);
var info=[t.class_done?"Done":"Not yet",t.notes_done?"Done":"Not yet",p.understood_at?"Marked "+fmtT(p.understood_at):"Not yet",
p.oral_at?"Done "+fmtT(p.oral_at)+" · Score "+(p.oral_score||"–")+"/5"+(p.oral_remarks?"<br>"+esc(p.oral_remarks):""):(p.understood_at?'Call '+esc(s.full_name)+(s.phone?' on <b>'+esc(s.phone)+'</b>':'')+', then record:<span class="inl"><select id="oS"><option value="">Score</option><option>1</option><option>2</option><option>3</option><option>4</option><option>5</option></select><input id="oR" placeholder="Remarks"><button class="btn s p" id="bO">Save oral test</button></span>':"Waiting for the student"),
p.mcq_at?"Done "+fmtT(p.mcq_at)+(p.mcq_score?" · Score "+esc(p.mcq_score):""):"Not yet",
p.answer_at?'Submitted '+fmtT(p.answer_at)+' · <a href="#" id="vA">Open answer sheet</a>':"Not yet",
p.eval_at?"Done "+fmtT(p.eval_at)+" · Marks "+esc(p.eval_marks||"–")+(p.eval_path?' · <a href="#" id="vE">Evaluated copy</a>':"")+(p.eval_remarks?"<br>"+esc(p.eval_remarks):""):(p.answer_at?'<span class="inl"><input id="eM" placeholder="Marks, e.g. 6/10"><input id="eF" type="file" accept="application/pdf,image/*" multiple title="One PDF (max 5 MB), or photos of each page"></span><textarea id="eR" placeholder="Written feedback"></textarea><button class="btn s p" id="bE" style="margin-top:6px">Save evaluation</button>':"Waiting for answers"),
p.improve_at?"Done "+fmtT(p.improve_at)+(p.improve_notes?"<br>"+esc(p.improve_notes):""):(p.eval_at?'<textarea id="iN" placeholder="Key points discussed on the call"></textarea><button class="btn s p" id="bI" style="margin-top:6px">Save improvement call</button>':"After evaluation")];
modal('<p class="subj" style="margin-top:0">'+esc(s.full_name)+' · '+esc(t.subject)+'</p><h2>'+esc(t.title)+'</h2>'+STEPS.map(function(x,i){return'<div class="step '+(st[i]&&st[i]!=="n"?"s"+st[i]:"")+'"><span class="n">'+(st[i]==="d"?"✓":i+1)+'</span><div><b>'+x[0]+'</b><span class="who">'+(x[1]==="You"?"Student":x[1])+'</span><p>'+info[i]+'</p></div></div>'}).join("")+'<div id="mm"></div>');
function save(f,b){b.disabled=true;f.student_id=sid;f.topic_id=tid;return db.from("progress").upsert(f).select().single().then(function(r){if(r.error){b.disabled=false;return msg("mm",r.error.message)}PROG[sid+":"+tid]=r.data;mentorModal(sid,tid)})}
if($("bO"))$("bO").onclick=function(){if(!$("oS").value)return msg("mm","Choose a score from 1 to 5.");save({oral_at:new Date().toISOString(),oral_score:+$("oS").value,oral_remarks:$("oR").value.trim()||null},this)};
if($("bE"))$("bE").onclick=function(){var b=this,f=$("eF").files[0]?$("eF").files:null;b.disabled=true;msg("mm",f?"Compressing and uploading…":"",true);(f?upCopy(sid,tid,"evaluated",f):Promise.resolve(null)).then(function(path){var x={eval_at:new Date().toISOString(),eval_marks:$("eM").value.trim()||null,eval_remarks:$("eR").value.trim()||null};if(path)x.eval_path=path;return save(x,b)}).catch(function(e){b.disabled=false;msg("mm",e.message)})};
if($("bI"))$("bI").onclick=function(){save({improve_at:new Date().toISOString(),improve_notes:$("iN").value.trim()||null},this)};
if($("vA"))$("vA").onclick=function(e){e.preventDefault();openFile(p.answer_path)};if($("vE"))$("vE").onclick=function(e){e.preventDefault();openFile(p.eval_path)}}
</script></body></html>
